services:
  - type: web
    name: gtae-atra-security-engine
    runtime: python
    buildCommand: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: python src/web_monitor_server.py
    envVars:
      - key: PORT
        value: 10000
      - key: MONITOR_HOST
        value: 0.0.0.0
